[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medcheck"
version = "0.1.0"
description = "Medication interaction and dose-ceiling adjudication with a deterministic safety core. NOT FOR CLINICAL USE."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
medcheck = "medcheck.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "live: requires a model endpoint (never runs in offline CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "test", "scripts"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLW", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "RUF001", # the mask token uses guillemet-style angle quotes deliberately
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# scripts and tests insert src/ on sys.path before importing the package
"scripts/*.py" = ["E402"]
"test/**/*.py" = ["E402"]

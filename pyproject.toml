[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medcheck"
version = "0.1.0"
description = "Medication interaction and dose-ceiling adjudication with a deterministic safety core. NOT FOR CLINICAL USE."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
medcheck = "medcheck.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "live: requires a model endpoint (never runs in offline CI)",
]

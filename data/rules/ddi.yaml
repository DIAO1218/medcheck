# Declared knowledge holes. Absence of a pair from `interactions` normally means
# "no known interaction" -- but only for pairs we have actually assessed. A pair
# listed here is explicitly *unassessed*, which must produce COVERAGE_GAP and a
# HOLD (INV-001). Declaring holes is how the table stays honest about its own
# limits instead of silently treating ignorance as safety.
coverage_holes:
  - pair: [metformin, ciprofloxacin]
    note: renal clearance interaction not enumerated in this teaching table
  - pair: [vancomycin, furosemide]
    note: additive ototoxicity suspected but not assessed in this teaching table

# Drug-drug interaction table.
#
# TEACHING DATA ONLY. These entries are illustrative and must not be used for
# clinical decisions. Every row carries the source class it is modelled on so a
# reviewer can audit it (R-01: a table row without a source is a guess).
#
# Coverage contract: 40 assessed pairs among 18 drugs. Absence of a pair from
# this list means "no known interaction" ONLY for pairs not listed under
# coverage_holes below.
version: "2026.11.1"
interactions:
